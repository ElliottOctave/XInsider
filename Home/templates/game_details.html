<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Details - Football Dashboard</title>
  <link rel="stylesheet" href="/Home/static/styles/game_details.css" />
  <link rel="stylesheet" href="/Home/static/styles/XInsider.css" />
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <main class="pitch-container" id="main-content" style="display: none;">
    <div class="lineup-table left-lineup">
      <h3 id="left-team-name">Left Team</h3>
      <ul id="left-lineup-list"></ul>
    </div>

    <div id="pitch"></div>

    <div class="lineup-table right-lineup">
      <h3 id="right-team-name">Right Team</h3>
      <ul id="right-lineup-list"></ul>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="/Home/static/scripts/game_details.js"></script>
  <script src="/Home/static/components/navbarSearch.js"></script>
  <script src="/Home/static/components/navbar.js"></script>
  <script src="/Home/static/components/footer.js"></script>
  <script src="/Home/static/components/loader.js"></script>
</body>
</html>
