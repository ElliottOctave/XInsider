<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Details - Football Dashboard</title>
  <link rel="stylesheet" href="/Home/static/styles/game_details.css" />
  <link rel="stylesheet" href="/Home/static/styles/XInsider.css" />
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <main class="pitch-container" id="main-content">
    <div class="lineup-table left-lineup">
      <div class="team-panel">
        <h3 id="left-team-name"><img id="left-team-logo" class="team-logo" /><span></span></h3>
        <div id="left-team-manager" class="team-manager"></div>
        <div id="left-team-formation" class="team-formation">4-3-3</div>
      </div>
      <ul id="left-lineup-list"></ul>
    </div>

    <div id="pitch"></div>

    <div class="lineup-table right-lineup">
      <div class="team-panel">
        <h3 id="right-team-name"><img id="right-team-logo" class="team-logo" /><span></span></h3>
        <div id="right-team-manager" class="team-manager"></div>
        <div id="right-team-formation" class="team-formation">4-3-3</div>
      </div>
      <ul id="right-lineup-list"></ul>
    </div>
  </main>

  <div id="timeline-container">
    <input type="range" id="minute-slider" min="0" max="90" step="1" value="0" />
    <div id="current-minute">0'</div>
  </div>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="/Home/static/scripts/game_details.js"></script>
  <script src="/Home/static/components/navbarSearch.js"></script>
  <script src="/Home/static/components/navbar.js"></script>
  <script src="/Home/static/components/footer.js"></script>
</body>
</html>
