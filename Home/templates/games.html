<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Games - Football Dashboard</title>
  <link rel="stylesheet" href="/Home/static/styles/home.css" />
  <link rel="stylesheet" href="/Home/static/styles/chart.css" />
  <link rel="stylesheet" href="/Home/static/styles/games.css" />
</head>
<body>
  <!-- Navbar -->
  <div id="navbar-container"></div>

  <main class="dashboard">
    <h2>All Matches</h2>

    <!-- Filters -->
    <div class="filters">
      <label for="yearFilter">Year:</label>
      <select id="yearFilter">
        <option value="all">All</option>
      </select>

      <label for="teamFilter">Team:</label>
      <input type="text" id="teamFilter" placeholder="Type to filter teams...">
    </div>

    <!-- Match Cards -->
    <div class="match-container" id="matches-list"></div>

    <!-- Pagination -->
    <div class="pagination">
      <button id="prevPage">&laquo; Prev</button>
      <span id="pageInfo"></span>
      <button id="nextPage">Next &raquo;</button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Football Dashboard | All rights reserved.</p>
    <p>Built by your awesome group for the InfoVis course 🚀</p>
  </footer>

  <script src="/Home/static/scripts/games.js"></script>
  <script src="/Home/static/scripts/navbar.js"></script>
  <script src="/Home/static/scripts/navbarSearch.js"></script>
</body>
</html>
