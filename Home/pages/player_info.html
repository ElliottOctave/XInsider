<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Profile - XInsider</title>
  <link rel="stylesheet" href="/Home/static/styles/player_info.css" />
  <link rel="stylesheet" href="/Home/static/styles/XInsider.css" />
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <!-- Main Content -->
  <main class="player-profile-wrapper">

    <!-- Left Spacer -->
    <div class="left-spacer"></div>

    <!-- Player Info and Charts -->
    <section class="player-profile-content" id="main-content">
      
      <!-- Player Details -->
      <section id="player-details" class="player-details chart-section">
        <div id="player-info" class="player-info"></div>
      </section>

      <!-- Performance Summary -->
      <section id="performance" class="chart-section">
        <h2>Performance Summary</h2>
        <div class="performance-charts">
          <svg id="goalsChart" width="250" height="250"></svg>
          <svg id="cardsChart" width="250" height="250"></svg>
          <svg id="minutesChart" width="250" height="250"></svg>
        </div>
      </section>

            <!-- Transfer History -->
      <section id="timeline" class="chart-section">
        <h2>Transfer History</h2>
        <svg id="timeChart" width="800" height="400"></svg>
      </section>

            <!-- Trophies -->
      <section id="trophies-container" class="chart-section">
        <h2 id="trophies-title">All Trophies</h2>
        <div id="trophies"></div>
      </section>
    </section>

    <!-- Trophies and Performance Section -->
    <aside id="trophies-section">
      <section id="performance" class="chart-section">
        <h2>Field Positions</h2>
        <div class="performance-charts bottom-row">
          <svg id="halfField" width="500" height="500"></svg>
        </div>
      </section>

      <!-- Performance History -->
      <section id="performance-history" class="chart-section">
        <h2>Performance History</h2>
        <div id="carouselChart"></div>
        <button id="pauseButton">
          <img id="pauseIcon" src="https://www.svgrepo.com/show/336067/pause.svg" alt="Pause">
        </button>
      </section>

      <!-- Market Value -->
      <section id="market-value-chart-container" class="chart-section">
        <h2>Market Value Evolution</h2>
        <svg id="marketValueChart" width="800" height="400"></svg> 
      </section>
    </aside>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="/node_modules/d3/dist/d3.min.js"></script>
  <script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>
  <script src="https://unpkg.com/versor@0.4.2/versor.min.js"></script>
  <script src="https://unpkg.com/topojson@3"></script>
  
  <!-- Custom Scripts -->
  <script src="/Home/static/scripts/playerInfo.js" type="module"></script>
  <script src="/Home/static/components/navbarSearch.js"></script>
  <script src="/Home/static/components/navbar.js"></script>
  <script src="/Home/static/components/footer.js"></script>
  <script src="/Home/static/components/loader.js"></script>

</body>
</html>
