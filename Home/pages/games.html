<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Games - XInsider</title>
  <link rel="stylesheet" href="/Home/static/styles/chart.css" />
  <link rel="stylesheet" href="/Home/static/styles/games.css" />
  <link rel="stylesheet" href="/Home/static/styles/XInsider.css" />
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <main class="dashboard" id="main-content">
    <h2>All Matches</h2>

    <!-- Filters -->
    <div class="filters">
      <label for="yearFilter">Year:</label>
      <select id="yearFilter">
        <option value="all">All</option>
      </select>

      <label for="teamFilter">Team:</label>
      <input type="text" id="teamFilter" placeholder="Type to filter teams...">
    </div>

    <!-- Match Cards -->
    <div class="match-container" id="matches-list"></div>

    <!-- Pagination -->
    <div class="pagination">
      <button id="prevPage">&laquo; Prev</button>
      <span id="pageInfo"></span>
      <button id="nextPage">Next &raquo;</button>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="/Home/static/scripts/games.js"></script>
  <script src="/Home/static/components/navbarSearch.js"></script>
  <script src="/Home/static/components/navbar.js"></script>
  <script src="/Home/static/components/footer.js"></script>
  <script src="/Home/static/components/loader.js"></script>
</body>
</html>
