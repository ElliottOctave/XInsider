<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club Info - XInsider</title>

  <!-- Stijlen -->
   <link rel="stylesheet" href="/Home/static/styles/XInsider.css" />
  <link rel="stylesheet" href="/Home/static/styles/club_info.css" />
  
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <!-- Hero Section -->
  <main>
    <!-- Hero Section: Logo, Name, League, Coach, Stadium -->
    <section id="hero-section"></section>

    <!-- Quick Stats: Age, Squad Size, Transfers, etc. -->
    <section id="quick-stats"></section>

    <!-- Layout for charts: Left and Right columns -->
    <section id="viz-top-row">
      <div id="viz-left"></div>
      <div id="viz-right"></div>
    </section>

    <section id="game-info-row">
      <div id="game-left"></div>
      <div id="game-right"></div>
    </section>

    <section id="viz-bottom-row"></section>

  

    <!-- Full width row for comparisons or stacked visuals -->
    <section id="full-width-row"></section>

    <!-- Squad by Position Tabs -->
    <section id="squad-section"></section>
  </main>

  

  <!-- Externe scripts -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>
  <script src="https://unpkg.com/versor@0.4.2/versor.min.js"></script>
  <script src="https://unpkg.com/topojson@3"></script>

  <!-- Custom JS -->
  <script type="module" src="/Home/static/scripts/clubInfo.js"></script>



  <!-- Componenten -->
  <script src="/Home/static/components/navbarSearch.js"></script>
  <script src="/Home/static/components/navbar.js"></script>
  <script src="/Home/static/components/footer.js"></script>
  <script src="/Home/static/components/loader.js"></script>

  <!-- Footer -->
  <div id="footer-container"></div>
</body>
</html>
