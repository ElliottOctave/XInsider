<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Players - XInsider</title>
  <link rel="stylesheet" href="/Home/static/styles/chart.css" />
  <link rel="stylesheet" href="/Home/static/styles/player_list.css" />
  <link rel="stylesheet" href="/Home/static/styles/XInsider.css" />

</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <main class="dashboard" id="main-content">
    <input type="text" id="player-search-bar" placeholder="Search for a player..." class="search-bar" />
    <div id="players-list"></div> <!-- Container for the player list -->
        <!-- Pagination -->
    <div class="pagination">
      <button id="prevPage">&laquo; Prev</button>
      <span id="pageInfo"></span>
      <button id="nextPage">Next &raquo;</button>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/papaparse/5.3.0/papaparse.min.js"></script> <!-- PapaParse library -->
  <script src="/Home/static/scripts/playerList.js"></script>

  <script src="/Home/static/components/navbarSearch.js"></script>
  <script src="/Home/static/components/navbar.js"></script>
  <script src="/Home/static/components/footer.js"></script>
  <script src="/Home/static/components/loader.js"></script>
</body>
</html>
